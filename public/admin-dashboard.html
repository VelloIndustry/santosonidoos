<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Chamba Mentality</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --surface2: #1a1a1a;
      --border: #242424;
      --gold: #d4a847;
      --text: #e8e8e8;
      --muted: #888;
      --dim: #555;
      --green: #22c55e;
      --red: #ef4444;
      --blue: #60a5fa;
      --orange: #fb923c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; min-height: 100vh; }
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo { color: var(--gold); font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .badge { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-size: 11px; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .nav { display: flex; align-items: center; gap: 8px; }
    .nav a, .nav button { color: var(--muted); background: transparent; border: 1px solid transparent; text-decoration: none; font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .nav a:hover, .nav button:hover { color: var(--text); background: var(--surface2); }
    .nav a.active { color: var(--gold); border-color: rgba(212,168,71,0.25); background: rgba(212,168,71,0.08); }
    .main { max-width: 1360px; margin: 0 auto; padding: 28px 24px 48px; }
    .page-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    h1 { font-size: 26px; line-height: 1.15; letter-spacing: 0; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 13px; }
    .quick { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .btn { border: 1px solid var(--border); background: var(--surface2); color: var(--text); border-radius: 6px; padding: 9px 13px; text-decoration: none; font-size: 13px; font-weight: 600; }
    .btn.primary { background: var(--gold); color: #050505; border-color: var(--gold); }
    .grid { display: grid; gap: 16px; }
    .metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 16px; }
    .content { grid-template-columns: 1.1fr 0.9fr; align-items: start; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .card-pad { padding: 18px; }
    .metric-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
    .metric-value { font-size: 25px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .metric-sub { color: var(--dim); font-size: 12px; margin-top: 4px; }
    .section-head { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); }
    .section-link { color: var(--gold); text-decoration: none; font-size: 12px; }
    .list { display: flex; flex-direction: column; }
    .row { padding: 13px 16px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
    .row:last-child { border-bottom: none; }
    .row-title { font-weight: 650; margin-bottom: 3px; }
    .row-meta { color: var(--muted); font-size: 12px; }
    .amount { color: var(--gold); font-weight: 750; font-variant-numeric: tabular-nums; }
    .pill { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 650; background: var(--surface2); color: var(--muted); }
    .pill.green { background: rgba(34,197,94,0.12); color: var(--green); }
    .pill.red { background: rgba(239,68,68,0.12); color: var(--red); }
    .pill.blue { background: rgba(96,165,250,0.12); color: var(--blue); }
    .empty { color: var(--dim); padding: 28px 16px; text-align: center; font-size: 13px; }
    .stack { display: grid; gap: 16px; }
    .chart-wrap { padding: 20px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
    .chart-legend { display: flex; flex-direction: column; gap: 10px; min-width: 140px; }
    .legend-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-label { color: var(--muted); font-size: 12px; }
    .legend-val { font-weight: 700; font-variant-numeric: tabular-nums; margin-left: auto; }
    .entries-scroll { max-height: 420px; overflow-y: auto; }
    .entries-scroll::-webkit-scrollbar { width: 4px; }
    .entries-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    @media (max-width: 900px) {
      .header { align-items: flex-start; gap: 12px; flex-direction: column; }
      .nav { flex-wrap: wrap; }
      .page-top { flex-direction: column; }
      .quick { justify-content: flex-start; }
      .metrics, .content { grid-template-columns: 1fr; }
    }
  </style>
<link rel="stylesheet" href="/finance-view.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <div class="logo">Chamba Mentality</div>
      <span class="badge">Dashboard</span>
    </div>
    <nav class="nav">
      <a href="/dashboard" class="active">Overview</a>
      <a href="/money#entries">Transactions</a><a href="/money#payback">Investment &amp; Payback</a>
      <form method="POST" action="/logout" style="margin:0"><button>Logout</button></form>
    </nav>
  </header>

  <main class="main"><div id="overview"><p role="status">Loading financial overview…</p></div></main>
  <script src="/finance.js"></script>
  <script src="/finance-view.js"></script>
  <script>
  (async () => {
    const el = document.getElementById('overview');
    try {
      const entries = await ChambaFinance.allEntries(async path => {
        const response = await fetch('/api/budget' + path);
        if (!response.ok) throw new Error('Unable to load financial records');
        return response.json();
      });
      ChambaFinanceView.render(el, entries);
    } catch (error) { el.textContent = 'Unable to load financial records. Please refresh to retry.'; }
  })();
  </script>
</body></html>
